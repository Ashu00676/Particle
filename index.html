<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✦ GOD LEVEL HAND MAGIC | Particle Alchemy ✦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            touch-action: none;
        }

        /* Glassmorphic UI - Mobile optimized */
        .ui-container {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 200;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .brand-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 68, 204, 0.4);
            box-shadow: 0 0 30px rgba(255, 68, 204, 0.2);
            flex: 1;
            min-width: 140px;
        }

        .brand-card h1 {
            font-size: 14px;
            background: linear-gradient(135deg, #ff44cc, #ffaa44, #44ffcc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .brand-card p {
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            margin-top: 2px;
        }

        .stats-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 8px 16px;
            text-align: right;
            border: 1px solid rgba(0, 255, 170, 0.4);
        }

        .stats-card div {
            font-family: monospace;
            font-size: 11px;
            color: #0f0;
            font-weight: bold;
        }

        .shape-badge {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(24px);
            padding: 12px 24px;
            border-radius: 60px;
            text-align: center;
            z-index: 200;
            border: 1.5px solid #ff44dd;
            box-shadow: 0 0 40px rgba(255, 68, 221, 0.4);
            white-space: nowrap;
            pointer-events: none;
        }

        .shape-badge .shape-icon {
            font-size: 28px;
            display: inline-block;
            margin-right: 10px;
            filter: drop-shadow(0 0 8px #ff44dd);
        }

        .shape-badge .shape-name {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffaaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .gesture-suggestion {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 48px;
            z-index: 200;
            font-size: 12px;
            font-weight: 600;
            font-family: monospace;
            white-space: nowrap;
            border: 1px solid #ffaa33;
            color: #ffaa66;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255,170,51,0.3);
        }

        .instruction-chip {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 9px;
            color: #ccc;
            font-family: monospace;
            z-index: 200;
            pointer-events: none;
            border: 1px solid #44ffaa66;
        }

        .video-feed-mini {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 85px;
            height: 64px;
            border-radius: 20px;
            border: 2px solid #ff44dd;
            object-fit: cover;
            opacity: 0.9;
            z-index: 250;
            box-shadow: 0 0 15px rgba(255,68,221,0.6);
            pointer-events: none;
        }

        @media (max-width: 650px) {
            .shape-badge { padding: 8px 18px; top: 12px; }
            .shape-badge .shape-icon { font-size: 22px; }
            .shape-badge .shape-name { font-size: 14px; }
            .gesture-suggestion { font-size: 10px; bottom: 75px; white-space: nowrap; padding: 6px 14px; }
            .brand-card { padding: 6px 12px; }
            .brand-card h1 { font-size: 11px; }
            .stats-card { padding: 5px 12px; }
            .stats-card div { font-size: 9px; }
            .video-feed-mini { width: 65px; height: 49px; bottom: 12px; right: 12px; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="shape-badge" id="shapeBadge">
        <span class="shape-icon" id="shapeIcon">🌀</span>
        <span class="shape-name" id="shapeName">CIRCLE</span>
    </div>

    <div class="instruction-chip" id="statusChip">
        📡 INIT CAM...
    </div>

    <div class="gesture-suggestion" id="gestureSuggestion">
        ✨ OPEN PALM = SMOOTH MORPH | FIST = EXPLOSION ✨
    </div>

    <div class="ui-container">
        <div class="brand-card">
            <h1>✦ GOD PARTICLE ALCHEMY ✦</h1>
            <p>hand gestures → infinite sacred shapes</p>
        </div>
        <div class="stats-card">
            <div id="fpsCounter">FPS: --</div>
            <div id="particleCount" style="font-size:8px; color:#ff88aa;">⚡ 15K particles</div>
        </div>
    </div>

    <video id="handVideo" class="video-feed-mini" autoplay playsinline muted></video>

    <!-- Import Three.js + advanced addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- GOD LEVEL SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010015);
        scene.fog = new THREE.FogExp2(0x010015, 0.0003);
        
        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Bloom effect (divine glow)
        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.5, 0.85);
        bloomPass.threshold = 0.02;
        bloomPass.strength = 1.3;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderPass);
        effectComposer.addPass(bloomPass);
        
        // Galactic Starfield
        const starCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 220;
            starPos[i*3+1] = (Math.random() - 0.5) * 140;
            starPos[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending }));
        scene.add(starField);
        
        // --- GOD LEVEL PARTICLES: 15,000 with dynamic size & glow trail effect ---
        const PARTICLE_COUNT = 15000;
        const particleGeometry = new THREE.BufferGeometry();
        const initialPos = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const rad = Math.pow(Math.random(), 1.2) * 6;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            initialPos[i*3] = rad * Math.sin(phi) * Math.cos(theta);
            initialPos[i*3+1] = rad * Math.sin(phi) * Math.sin(theta);
            initialPos[i*3+2] = rad * Math.cos(phi);
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(initialPos, 3));
        
        // Divine Colors (rainbow + neon)
        const colorAttr = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const choice = (i % 7);
            if (choice < 2) {
                colorAttr[i*3] = 0.9 + Math.random()*0.3;   // R
                colorAttr[i*3+1] = 0.2 + Math.random()*0.4;
                colorAttr[i*3+2] = 0.8 + Math.random()*0.2;
            } else if (choice < 4) {
                colorAttr[i*3] = 0.3 + Math.random()*0.3;
                colorAttr[i*3+1] = 0.6 + Math.random()*0.4;
                colorAttr[i*3+2] = 1.0;
            } else {
                colorAttr[i*3] = 1.0;
                colorAttr[i*3+1] = 0.4 + Math.random()*0.5;
                colorAttr[i*3+2] = 0.5 + Math.random()*0.5;
            }
        }
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorAttr, 3));
        
        const particleMat = new THREE.PointsMaterial({ size: 0.11, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const particleSys = new THREE.Points(particleGeometry, particleMat);
        scene.add(particleSys);
        
        // Divine central orb
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff44aa, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
        const coreOrb = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), coreMat);
        scene.add(coreOrb);
        
        // --- 16 DIVINE SHAPES (God level) ---
        const SACRED_SHAPES = [
            'circle', 'square', 'triangle', 'heart', 'star', 'infinity', 'spiral', 'lotus',
            'diamond', 'hexagram', 'moon', 'flower', 'mandala', 'wave', 'butterfly', 'crown'
        ];
        
        let currentShape = 'circle';
        let currentShapeIdx = 0;
        let targetShapePositions = new Float32Array(PARTICLE_COUNT * 3);
        
        // Advanced shape generators
        function generateDivineShape(shapeName, tOffset = 0) {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const scale = 4.5;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = i / PARTICLE_COUNT;
                const angle = t * Math.PI * 2;
                let x, y, z;
                
                switch(shapeName) {
                    case 'circle':
                        x = Math.cos(angle) * scale;
                        y = Math.sin(angle) * scale;
                        z = Math.sin(angle * 4) * 0.6;
                        break;
                    case 'square':
                        const s = 4.0;
                        const edge = Math.floor(t * 4);
                        const p = (t * 4) - edge;
                        if (edge === 0) { x = -s + p * 2*s; y = -s; z = Math.sin(p*Math.PI)*0.7; }
                        else if (edge === 1) { x = s; y = -s + p * 2*s; z = Math.cos(p*Math.PI)*0.7; }
                        else if (edge === 2) { x = s - p * 2*s; y = s; z = Math.sin(p*Math.PI)*0.7; }
                        else { x = -s; y = s - p * 2*s; z = Math.cos(p*Math.PI)*0.7; }
                        break;
                    case 'triangle':
                        const corners = 3;
                        const ci = Math.floor((angle / (Math.PI*2)) * corners);
                        const ca = (ci * Math.PI*2 / corners);
                        const na = ((ci+1)%3) * Math.PI*2 / corners;
                        const fr = (angle - ca) / (Math.PI*2 / corners);
                        const ax = Math.cos(ca) * scale;
                        const ay = Math.sin(ca) * scale;
                        const bx = Math.cos(na) * scale;
                        const by = Math.sin(na) * scale;
                        x = ax * (1-fr) + bx * fr;
                        y = ay * (1-fr) + by * fr;
                        z = Math.sin(angle * 4) * 0.8;
                        break;
                    case 'heart':
                        const hx = 16 * Math.pow(Math.sin(angle), 3);
                        const hy = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2*Math.cos(3*angle) - Math.cos(4*angle);
                        x = hx * 0.24;
                        y = hy * 0.24;
                        z = Math.sin(angle * 3) * 0.5;
                        break;
                    case 'star':
                        const spikes = 5;
                        const outer = scale;
                        const inner = scale * 0.45;
                        const radStr = (Math.floor(angle * spikes / (Math.PI*2)) % 2 === 0) ? outer : inner;
                        x = Math.cos(angle) * radStr;
                        y = Math.sin(angle) * radStr;
                        z = Math.sin(angle * 6) * 0.6;
                        break;
                    case 'infinity':
                        x = Math.sin(angle) * 4.2;
                        y = Math.sin(2 * angle) * 2.8;
                        z = Math.cos(angle * 1.8) * 0.9;
                        break;
                    case 'spiral':
                        const rSpiral = t * 5.8;
                        const angSpiral = t * Math.PI * 10;
                        x = Math.cos(angSpiral) * rSpiral;
                        y = Math.sin(angSpiral) * rSpiral;
                        z = Math.sin(angSpiral * 1.5) * 1.1;
                        break;
                    case 'lotus':
                        const rLotus = scale * (0.6 + 0.4 * Math.sin(6 * angle));
                        x = Math.cos(angle) * rLotus;
                        y = Math.sin(angle) * rLotus;
                        z = Math.sin(angle * 8) * 0.7;
                        break;
                    case 'diamond':
                        const dia = 4.2;
                        const absT = Math.abs(t - 0.5) * 2;
                        x = (t - 0.5) * dia * 1.6;
                        y = (absT * 2 - 1) * dia;
                        z = Math.sin(t * Math.PI * 5) * 0.8;
                        break;
                    case 'hexagram':
                        const star6 = 3.8;
                        const r1 = star6;
                        const r2 = star6 * 0.5;
                        const useOuter = (Math.floor(angle * 6 / (Math.PI*2)) % 2 === 0);
                        const radHex = useOuter ? r1 : r2;
                        x = Math.cos(angle) * radHex;
                        y = Math.sin(angle) * radHex;
                        z = Math.sin(angle * 6) * 0.5;
                        break;
                    case 'moon':
                        const moonAngle = angle;
                        x = Math.cos(moonAngle) * 3.8;
                        y = Math.sin(moonAngle) * 2.2 + 0.8;
                        z = Math.sin(moonAngle * 2) * 0.6;
                        break;
                    case 'flower':
                        const petals = 8;
                        const rFlower = scale * (0.6 + 0.4 * Math.cos(petals * angle));
                        x = Math.cos(angle) * rFlower;
                        y = Math.sin(angle) * rFlower;
                        z = Math.sin(angle * petals) * 0.9;
                        break;
                    case 'mandala':
                        const rMand = scale * (0.55 + 0.35 * Math.sin(5 * angle));
                        x = Math.cos(angle) * rMand;
                        y = Math.sin(angle) * rMand;
                        z = Math.cos(angle * 7) * 0.7;
                        break;
                    case 'wave':
                        const wx = (t - 0.5) * 8.5;
                        const wy = Math.sin(t * Math.PI * 6) * 3.2;
                        x = wx;
                        y = wy;
                        z = Math.cos(t * Math.PI * 5) * 1.2;
                        break;
                    case 'butterfly':
                        const wingX = Math.sin(angle) * (Math.exp(Math.cos(angle)) - 2 * Math.cos(4*angle));
                        const wingY = Math.cos(angle) * (Math.exp(Math.cos(angle)) - 2 * Math.cos(4*angle));
                        x = wingX * 1.3;
                        y = wingY * 1.3;
                        z = Math.sin(angle * 3) * 0.9;
                        break;
                    case 'crown':
                        const crownT = t;
                        const crownX = Math.sin(crownT * Math.PI * 2) * 3.5;
                        const crownY = (crownT < 0.33 ? -2 + crownT*12 : (crownT < 0.66 ? 2 : 2 - (crownT-0.66)*12));
                        x = crownX;
                        y = crownY * 0.8;
                        z = Math.sin(crownT * Math.PI * 8) * 0.5;
                        break;
                    default:
                        x = Math.cos(angle) * scale;
                        y = Math.sin(angle) * scale;
                        z = 0;
                }
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            }
            return positions;
        }
        
        targetShapePositions = generateDivineShape('circle');
        
        // --- HAND TRACKING + GESTURE SUGGESTIONS (Mobile Friendly)---
        const videoElem = document.getElementById('handVideo');
        let handLandmarks = null;
        let handDetected = false;
        let handGesture = "open";
        let handPos = { x: 0.5, y: 0.5 };
        let lastHandX = 0.5;
        let shapeChangeCooldown = 0;
        
        async function initHands() {
            try {
                const { FilesetResolver, HandLandmarker } = await import('https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3');
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
                    runningMode: "VIDEO", numHands: 1
                });
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } } });
                videoElem.srcObject = stream;
                await videoElem.play();
                document.getElementById('statusChip').innerHTML = "🖐️ HAND ACTIVE | GESTURE MAGIC";
                
                function getGesture(landmarks) {
                    if (!landmarks) return "open";
                    const tips = [4,8,12,16,20], bases = [3,6,10,14,18];
                    let sum = 0;
                    for (let i=0;i<5;i++) sum += Math.hypot(landmarks[tips[i]].x - landmarks[bases[i]].x, landmarks[tips[i]].y - landmarks[bases[i]].y);
                    return sum > 0.85 ? "open" : "fist";
                }
                
                async function detectLoop() {
                    if (videoElem.readyState >= 2) {
                        const detections = handLandmarker.detectForVideo(videoElem, performance.now());
                        if (detections.landmarks && detections.landmarks.length > 0) {
                            handLandmarks = detections.landmarks[0];
                            handDetected = true;
                            handPos = { x: handLandmarks[0].x, y: handLandmarks[0].y };
                            handGesture = getGesture(handLandmarks);
                            
                            // gesture suggestion text update
                            const suggDiv = document.getElementById('gestureSuggestion');
                            if (handGesture === "open") {
                                suggDiv.innerHTML = "🖐️ OPEN PALM → ETHEREAL MORPH | Move to change shape 🖐️";
                                suggDiv.style.border = "1px solid #44ffaa";
                                suggDiv.style.color = "#aaffdd";
                            } else {
                                suggDiv.innerHTML = "✊ FIST → COSMIC EXPLOSION | Particles burst & reshape ✊";
                                suggDiv.style.border = "1px solid #ff6644";
                                suggDiv.style.color = "#ffaa88";
                            }
                            
                            // shape change based on hand X position (smooth)
                            if (shapeChangeCooldown <= 0) {
                                const rawIndex = Math.floor(handPos.x * SACRED_SHAPES.length);
                                let newIdx = Math.min(SACRED_SHAPES.length-1, Math.max(0, rawIndex));
                                if (Math.abs(handPos.x - lastHandX) > 0.04 || handGesture === "fist") {
                                    if (newIdx !== currentShapeIdx) {
                                        currentShapeIdx = newIdx;
                                        currentShape = SACRED_SHAPES[currentShapeIdx];
                                        targetShapePositions = generateDivineShape(currentShape);
                                        // update UI with godly icons
                                        const icons = { circle:'⚪', square:'⬛', triangle:'🔺', heart:'❤️', star:'⭐', infinity:'∞', spiral:'🌀', lotus:'🪷', diamond:'💎', hexagram:'✡️', moon:'🌙', flower:'🌸', mandala:'🕉️', wave:'🌊', butterfly:'🦋', crown:'👑' };
                                        const icon = icons[currentShape] || '✨';
                                        document.getElementById('shapeIcon').innerHTML = icon;
                                        document.getElementById('shapeName').innerHTML = currentShape.toUpperCase();
                                        shapeChangeCooldown = 12;
                                    }
                                }
                            } else {
                                shapeChangeCooldown--;
                            }
                            lastHandX = handPos.x;
                        } else {
                            handDetected = false;
                        }
                    }
                    requestAnimationFrame(detectLoop);
                }
                detectLoop();
            } catch(e) { console.error(e); document.getElementById('statusChip').innerHTML = "⚠️ CAM ERROR"; }
        }
        initHands();
        
        // --- Particle Morph Engine (Silky smooth)---
        function morphParticles() {
            const posAttr = particleGeometry.attributes.position.array;
            let speed = handGesture === "fist" ? 0.095 : 0.045;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                const tx = targetShapePositions[ix];
                const ty = targetShapePositions[iy];
                const tz = targetShapePositions[iz];
                posAttr[ix] += (tx - posAttr[ix]) * speed;
                posAttr[iy] += (ty - posAttr[iy]) * speed;
                posAttr[iz] += (tz - posAttr[iz]) * speed;
            }
            particleGeometry.attributes.position.needsUpdate = true;
        }
        
        // Hand force field (attraction/repulsion god effect)
        function applyHandForce() {
            if (!handDetected || !handLandmarks) return;
            const posAttr = particleGeometry.attributes.position.array;
            const handWorldX = (handPos.x - 0.5) * 12;
            const handWorldY = (0.5 - handPos.y) * 9;
            const force = handGesture === "open" ? 0.13 : -0.22;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1;
                const dx = handWorldX - posAttr[ix];
                const dy = handWorldY - posAttr[iy];
                const dist = Math.hypot(dx, dy);
                if (dist < 2.8) {
                    const mag = force * (1 - dist/2.8) * 0.045;
                    posAttr[ix] += dx * mag;
                    posAttr[iy] += dy * mag;
                }
            }
            particleGeometry.attributes.position.needsUpdate = true;
        }
        
        // --- FPS Counter & camera motion ---
        let fpsFrame = 0, lastFpsTime = performance.now();
        function updateStats() {
            fpsFrame++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round((fpsFrame * 1000) / (now - lastFpsTime));
                document.getElementById('fpsCounter').innerHTML = `FPS: ${fps}`;
                document.getElementById('particleCount').innerHTML = `✨ ${PARTICLE_COUNT} divine particles`;
                fpsFrame = 0;
                lastFpsTime = now;
            }
        }
        
        let animTime = 0;
        function animateCameraAndStars() {
            animTime += 0.007;
            starField.rotation.y = animTime * 0.04;
            starField.rotation.x = Math.sin(animTime * 0.2) * 0.1;
            const glowPulse = 0.12 + Math.sin(animTime * 7) * 0.06;
            coreMat.opacity = glowPulse;
            if (handDetected) {
                const targetScale = handGesture === "open" ? 1.5 : 1.0;
                coreOrb.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                const camX = (handPos.x - 0.5) * 1.0;
                const camY = (handPos.y - 0.5) * -0.7;
                camera.position.x += (camX - camera.position.x) * 0.045;
                camera.position.y += (camY - camera.position.y) * 0.045;
                camera.lookAt(0, 0, 0);
            } else {
                coreOrb.scale.lerp(new THREE.Vector3(1,1,1), 0.05);
                camera.position.x *= 0.98;
                camera.position.y *= 0.98;
                camera.lookAt(0, 0, 0);
            }
        }
        
        // resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            morphParticles();
            applyHandForce();
            animateCameraAndStars();
            updateStats();
            effectComposer.render();
        }
        animate();
        
        console.log("✨ GOD LEVEL HAND MAGIC ACTIVE | 16 Sacred Shapes");
    </script>
</body>
</html>

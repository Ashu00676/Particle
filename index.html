<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOD LEVEL | Hand Particle Constellation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Main canvas fullscreen */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* BIG CAMERA FEED - overlay style */
        .camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            border-radius: 0;
            overflow: hidden;
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }
        
        .camera-container:hover {
            opacity: 0.5;
        }

        #webcamFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: brightness(0.9) contrast(1.1) saturate(1.2);
        }

        /* Hand skeleton overlay canvas */
        .skeleton-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        /* Premium UI - Glassmorphism */
        .ui-top {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
            pointer-events: none;
        }

        .shape-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 24px;
            border: 1px solid rgba(255, 68, 238, 0.6);
            box-shadow: 0 0 30px rgba(255, 68, 238, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .shape-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 8px #ff44ee);
        }

        .shape-name {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff44ee, #ffaa44, #44ffaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .status-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid rgba(0, 255, 170, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #0f0;
            border-radius: 50%;
            box-shadow: 0 0 8px #0f0;
            animation: pulse 1.5s infinite;
        }

        .status-text {
            font-size: 13px;
            font-weight: 600;
            color: #0f0;
            font-family: monospace;
        }

        .fps-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            color: #ffaa44;
            border: 1px solid #ffaa4466;
        }

        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            pointer-events: none;
        }

        .instruction-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .instruction-card span {
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .gesture-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 8px 20px;
            border-left: 3px solid #ff44ee;
        }

        .gesture-text {
            font-size: 13px;
            font-weight: 600;
            color: #ffaa88;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @media (max-width: 700px) {
            .shape-card { padding: 6px 16px; }
            .shape-icon { font-size: 20px; }
            .shape-name { font-size: 14px; }
            .status-card { padding: 6px 14px; }
            .status-text { font-size: 10px; }
            .fps-badge { padding: 6px 12px; font-size: 10px; }
            .instruction-card { padding: 6px 16px; }
            .instruction-card span { font-size: 10px; }
            .gesture-badge { padding: 6px 14px; }
            .gesture-text { font-size: 10px; }
            .bottom-bar { bottom: 12px; left: 12px; right: 12px; gap: 8px; }
            .ui-top { top: 12px; left: 12px; right: 12px; gap: 8px; }
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- BIG CAMERA (Full screen but semi-transparent) -->
    <div class="camera-container">
        <video id="webcamFeed" autoplay playsinline muted></video>
    </div>

    <!-- Canvas for hand skeleton (dots + lines) -->
    <canvas id="skeletonCanvas" class="skeleton-canvas"></canvas>

    <!-- UI Elements - Properly aligned -->
    <div class="ui-top">
        <div class="shape-card">
            <div class="shape-icon" id="shapeIcon">🌀</div>
            <div class="shape-name" id="shapeName">CIRCLE</div>
        </div>
        <div class="status-card">
            <div class="status-dot"></div>
            <div class="status-text" id="statusText">INITIALIZING</div>
        </div>
        <div class="fps-badge" id="fpsText">FPS: --</div>
    </div>

    <div class="bottom-bar">
        <div class="instruction-card">
            <span>✋ SHOW YOUR HAND</span>
            <span>→</span>
            <span>🎭 MOVE = SHAPE CHANGE</span>
        </div>
        <div class="gesture-badge" id="gestureBadge">
            <div class="gesture-text" id="gestureText">🖐️ OPEN PALM</div>
        </div>
    </div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- GOD LEVEL SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.0003);
        
        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        renderer.domElement.style.zIndex = '1';
        
        // Bloom for god rays
        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.5, 0.85);
        bloomPass.threshold = 0.05;
        bloomPass.strength = 1.3;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderPass);
        effectComposer.addPass(bloomPass);
        
        // Starfield - premium
        const starCount = 1500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 200;
            starPos[i*3+1] = (Math.random() - 0.5) * 120;
            starPos[i*3+2] = (Math.random() - 0.5) * 90 - 40;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const starsField = new THREE.Points(starGeo, starsMat);
        scene.add(starsField);
        
        // --- GOD LEVEL PARTICLES (constellation style) ---
        const PARTICLE_COUNT = 15000;
        const particleGeo = new THREE.BufferGeometry();
        const initialPos = new Float32Array(PARTICLE_COUNT * 3);
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = Math.pow(Math.random(), 1.2) * 6;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            initialPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            initialPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            initialPos[i*3+2] = r * Math.cos(phi);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(initialPos, 3));
        
        // Premium colors: neon rainbow
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const hue = (i / PARTICLE_COUNT) * 360;
            if (i % 3 === 0) {
                colors[i*3] = 0.9 + Math.random()*0.3;
                colors[i*3+1] = 0.2 + Math.random()*0.4;
                colors[i*3+2] = 0.9 + Math.random()*0.1;
            } else if (i % 3 === 1) {
                colors[i*3] = 0.2 + Math.random()*0.3;
                colors[i*3+1] = 0.7 + Math.random()*0.3;
                colors[i*3+2] = 1.0;
            } else {
                colors[i*3] = 1.0;
                colors[i*3+1] = 0.4 + Math.random()*0.5;
                colors[i*3+2] = 0.7 + Math.random()*0.3;
            }
        }
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const particleMat = new THREE.PointsMaterial({ size: 0.11, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // Central aura glow
        const coreGlow = new THREE.Mesh(
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xff44cc, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending })
        );
        scene.add(coreGlow);
        
        // --- MANY SHAPES (Premium) ---
        const SHAPES_LIST = [
            'circle', 'square', 'triangle', 'heart', 'star', 'infinity',
            'spiral', 'wave', 'flower', 'hexagon', 'diamond', 'butterfly',
            'ring', 'cross', 'moon'
        ];
        let currentShape = 'circle';
        let currentShapeIdx = 0;
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        
        function generateShapePositions(shapeType) {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const scale = 4.5;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = i / PARTICLE_COUNT;
                const angle = t * Math.PI * 2;
                let x, y, z;
                
                switch(shapeType) {
                    case 'circle':
                        x = Math.cos(angle) * scale;
                        y = Math.sin(angle) * scale;
                        z = Math.sin(angle * 3) * 0.6;
                        break;
                    case 'square':
                        const side = 4.0;
                        const edge = Math.floor(t * 4);
                        const p = (t * 4) - edge;
                        if (edge === 0) { x = -side + p * 2*side; y = -side; z = Math.sin(p * Math.PI) * 0.5; }
                        else if (edge === 1) { x = side; y = -side + p * 2*side; z = Math.cos(p * Math.PI) * 0.5; }
                        else if (edge === 2) { x = side - p * 2*side; y = side; z = Math.sin(p * Math.PI) * 0.5; }
                        else { x = -side; y = side - p * 2*side; z = Math.cos(p * Math.PI) * 0.5; }
                        break;
                    case 'triangle':
                        const corners = 3;
                        const ci = Math.floor((angle / (Math.PI*2)) * corners);
                        const ca = (ci * Math.PI*2 / corners);
                        const na = ((ci+1)%3) * Math.PI*2 / corners;
                        const frac = (angle - ca) / (Math.PI*2 / corners);
                        const ax = Math.cos(ca) * scale;
                        const ay = Math.sin(ca) * scale;
                        const bx = Math.cos(na) * scale;
                        const by = Math.sin(na) * scale;
                        x = ax * (1-frac) + bx * frac;
                        y = ay * (1-frac) + by * frac;
                        z = Math.sin(angle * 4) * 0.7;
                        break;
                    case 'heart':
                        const hx = 16 * Math.pow(Math.sin(angle), 3);
                        const hy = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2*Math.cos(3*angle) - Math.cos(4*angle);
                        x = hx * 0.24;
                        y = hy * 0.24;
                        z = Math.sin(angle * 2) * 0.5;
                        break;
                    case 'star':
                        const spikes = 5;
                        const rOuter = scale;
                        const rInner = scale * 0.45;
                        const rCurr = (Math.floor(angle * spikes / (Math.PI*2)) % 2 === 0) ? rOuter : rInner;
                        x = Math.cos(angle) * rCurr;
                        y = Math.sin(angle) * rCurr;
                        z = Math.sin(angle * 5) * 0.6;
                        break;
                    case 'infinity':
                        x = Math.sin(angle) * scale;
                        y = Math.sin(2 * angle) * scale * 0.65;
                        z = Math.cos(angle * 1.8) * 0.8;
                        break;
                    case 'spiral':
                        const rSpiral = t * 5.5;
                        const aSpiral = t * Math.PI * 10;
                        x = Math.cos(aSpiral) * rSpiral;
                        y = Math.sin(aSpiral) * rSpiral;
                        z = Math.sin(aSpiral * 1.5) * 1.0;
                        break;
                    case 'wave':
                        const wx = (t - 0.5) * 8.5;
                        const wy = Math.sin(t * Math.PI * 6) * 3.2;
                        x = wx;
                        y = wy;
                        z = Math.cos(t * Math.PI * 5) * 1.2;
                        break;
                    case 'flower':
                        const petals = 6;
                        const rFlower = scale * (0.7 + 0.35 * Math.sin(petals * angle));
                        x = Math.cos(angle) * rFlower;
                        y = Math.sin(angle) * rFlower;
                        z = Math.sin(angle * petals) * 0.8;
                        break;
                    case 'hexagon':
                        const hexScale = scale;
                        const seg = Math.floor(angle / (Math.PI*2/6));
                        const segAng = seg * Math.PI*2/6;
                        const nextSegAng = ((seg+1)%6) * Math.PI*2/6;
                        const tHex = (angle - segAng) / (Math.PI*2/6);
                        const p1x = Math.cos(segAng) * hexScale;
                        const p1y = Math.sin(segAng) * hexScale;
                        const p2x = Math.cos(nextSegAng) * hexScale;
                        const p2y = Math.sin(nextSegAng) * hexScale;
                        x = p1x * (1-tHex) + p2x * tHex;
                        y = p1y * (1-tHex) + p2y * tHex;
                        z = Math.sin(angle * 3) * 0.6;
                        break;
                    case 'diamond':
                        const diaOff = (t - 0.5) * 2;
                        x = (t - 0.5) * 6.5;
                        y = (Math.abs(diaOff) * 2 - 1) * 4.5;
                        z = Math.sin(t * Math.PI * 5) * 0.7;
                        break;
                    case 'butterfly':
                        const bxW = Math.sin(angle) * (Math.exp(Math.cos(angle)) - 2 * Math.cos(4*angle));
                        const byW = Math.cos(angle) * (Math.exp(Math.cos(angle)) - 2 * Math.cos(4*angle));
                        x = bxW * 1.3;
                        y = byW * 1.3;
                        z = Math.sin(angle * 3) * 0.8;
                        break;
                    case 'ring':
                        const ringR = 4.2;
                        x = Math.cos(angle) * ringR;
                        y = Math.sin(angle) * ringR;
                        z = Math.cos(angle * 6) * 0.9;
                        break;
                    case 'cross':
                        if (t < 0.5) {
                            x = (t * 2 - 0.5) * 6;
                            y = 0;
                        } else {
                            x = 0;
                            y = ((t - 0.5) * 2 - 0.5) * 6;
                        }
                        z = Math.sin(angle * 4) * 0.5;
                        break;
                    case 'moon':
                        const moonAng = angle;
                        const moonR = 4.2;
                        x = Math.cos(moonAng) * moonR;
                        y = Math.sin(moonAng) * moonR * 0.9;
                        z = Math.cos(moonAng * 2) * 0.6 + 0.3;
                        break;
                    default:
                        x = Math.cos(angle) * scale;
                        y = Math.sin(angle) * scale;
                        z = 0;
                }
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            }
            return positions;
        }
        
        targetPositions = generateShapePositions('circle');
        
        // --- HAND TRACKING (Full screen) ---
        const videoEl = document.getElementById('webcamFeed');
        let handLandmarks = null;
        let handDetected = false;
        let handGesture = "open";
        let handPos = { x: 0.5, y: 0.5 };
        let lastHandX = 0.5;
        
        // Skeleton drawing on canvas (dot-to-dot joint)
        const skeletonCanvas = document.getElementById('skeletonCanvas');
        const ctx = skeletonCanvas.getContext('2d');
        
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12], [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20], [5,9],[9,13],[13,17]
        ];
        
        function drawSkeleton(landmarks) {
            if (!landmarks || !handDetected) {
                ctx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
                return;
            }
            ctx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
            const w = skeletonCanvas.width;
            const h = skeletonCanvas.height;
            
            // draw connections (neon lines)
            ctx.beginPath();
            ctx.lineWidth = Math.max(2.5, w / 180);
            ctx.strokeStyle = '#ff44ee';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff44ee';
            for (let conn of HAND_CONNECTIONS) {
                const p1 = landmarks[conn[0]];
                const p2 = landmarks[conn[1]];
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x * w, p1.y * h);
                    ctx.lineTo(p2.x * w, p2.y * h);
                    ctx.stroke();
                }
            }
            // draw dots (glowing joints)
            for (let i = 0; i < landmarks.length; i++) {
                const lm = landmarks[i];
                const x = lm.x * w;
                const y = lm.y * h;
                ctx.beginPath();
                ctx.arc(x, y, Math.max(4, w / 140), 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, Math.max(2, w / 220), 0, Math.PI * 2);
                ctx.fillStyle = '#ff88ff';
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        function resizeSkeletonCanvas() {
            skeletonCanvas.width = window.innerWidth;
            skeletonCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSkeletonCanvas);
        resizeSkeletonCanvas();
        
        // MediaPipe init
        async function initHandTracking() {
            try {
                const { FilesetResolver, HandLandmarker } = await import('https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3');
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 } } });
                videoEl.srcObject = stream;
                await videoEl.play();
                document.getElementById('statusText').innerHTML = "TRACKING";
                document.getElementById('statusText').style.color = "#0f0";
                
                async function detectLoop() {
                    if (videoEl.readyState >= 2) {
                        const detections = handLandmarker.detectForVideo(videoEl, performance.now());
                        if (detections.landmarks && detections.landmarks.length > 0) {
                            handLandmarks = detections.landmarks[0];
                            handDetected = true;
                            handPos = { x: handLandmarks[0].x, y: handLandmarks[0].y };
                            
                            // detect gesture
                            const tips = [4,8,12,16,20];
                            const bases = [3,6,10,14,18];
                            let totalDist = 0;
                            for (let i = 0; i < tips.length; i++) {
                                totalDist += Math.hypot(handLandmarks[tips[i]].x - handLandmarks[bases[i]].x, handLandmarks[tips[i]].y - handLandmarks[bases[i]].y);
                            }
                            handGesture = totalDist > 0.85 ? "open" : "fist";
                            document.getElementById('gestureText').innerHTML = handGesture === "open" ? "🖐️ OPEN PALM" : "✊ FIST MODE";
                            
                            // shape change based on hand X position
                            const movement = Math.abs(handPos.x - lastHandX);
                            if (movement > 0.04) {
                                const newIdx = Math.floor(handPos.x * SHAPES_LIST.length) % SHAPES_LIST.length;
                                if (newIdx !== currentShapeIdx) {
                                    currentShapeIdx = newIdx;
                                    currentShape = SHAPES_LIST[currentShapeIdx];
                                    targetPositions = generateShapePositions(currentShape);
                                    const icons = { circle:'⚪', square:'⬛', triangle:'🔺', heart:'❤️', star:'⭐', infinity:'∞', spiral:'🌀', wave:'🌊', flower:'🌸', hexagon:'🔷', diamond:'💎', butterfly:'🦋', ring:'💍', cross:'✝️', moon:'🌙' };
                                    document.getElementById('shapeIcon').innerHTML = icons[currentShape] || '✨';
                                    document.getElementById('shapeName').innerHTML = currentShape.toUpperCase();
                                }
                            }
                            lastHandX = handPos.x;
                            drawSkeleton(handLandmarks);
                        } else {
                            handDetected = false;
                            drawSkeleton(null);
                        }
                    }
                    requestAnimationFrame(detectLoop);
                }
                detectLoop();
            } catch(e) {
                console.error(e);
                document.getElementById('statusText').innerHTML = "CAMERA ERROR";
            }
        }
        
        initHandTracking();
        
        // Particle morphing
        function morphParticles() {
            const posAttr = particleGeo.attributes.position.array;
            const speed = handGesture === "fist" ? 0.095 : 0.045;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                posAttr[ix] += (targetPositions[ix] - posAttr[ix]) * speed;
                posAttr[iy] += (targetPositions[iy] - posAttr[iy]) * speed;
                posAttr[iz] += (targetPositions[iz] - posAttr[iz]) * speed;
            }
            particleGeo.attributes.position.needsUpdate = true;
        }
        
        // Hand force field
        function applyHandForce() {
            if (!handDetected || !handLandmarks) return;
            const posAttr = particleGeo.attributes.position.array;
            const handWorldX = (handPos.x - 0.5) * 12;
            const handWorldY = (0.5 - handPos.y) * 9;
            const force = handGesture === "open" ? 0.14 : -0.22;
            for (let i = 0; i < PARTICLE_COUNT; i += 3) {
                const dx = handWorldX - posAttr[i];
                const dy = handWorldY - posAttr[i+1];
                const dist = Math.hypot(dx, dy);
                if (dist < 2.8) {
                    const infl = force * (1 - dist/2.8) * 0.045;
                    posAttr[i] += dx * infl;
                    posAttr[i+1] += dy * infl;
                }
            }
        }
        
        // Animation & FPS
        let frame = 0, lastFpsTime = performance.now();
        let animTime = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            morphParticles();
            applyHandForce();
            
            animTime += 0.008;
            starsField.rotation.y = animTime * 0.04;
            starsField.rotation.x = Math.sin(animTime * 0.2) * 0.1;
            
            const pulse = 0.08 + Math.sin(animTime * 10) * 0.05;
            coreGlow.material.opacity = pulse;
            if (handDetected) {
                const targetScale = handGesture === "open" ? 1.5 : 0.9;
                coreGlow.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
            }
            
            camera.position.x += (0 - camera.position.x) * 0.02;
            camera.position.y += (Math.sin(animTime * 0.3) * 0.2 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);
            
            effectComposer.render();
            
            frame++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                document.getElementById('fpsText').innerHTML = `FPS: ${frame}`;
                frame = 0;
                lastFpsTime = now;
            }
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeSkeletonCanvas();
        });
    </script>
</body>

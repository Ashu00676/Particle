<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hand Storm AI | Gesture Controlled Particle Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Poppins', sans-serif;
            background: #000;
            touch-action: none;
        }

        /* Mobile-friendly neon UI */
        .info-panel {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 10px 16px;
            color: white;
            border-left: 3px solid #bc13fe;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.3);
            pointer-events: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .info-panel h1 {
            margin: 0;
            font-size: 16px;
            background: linear-gradient(135deg, #bc13fe, #e03aff, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            font-weight: 700;
        }

        .info-panel p {
            margin: 4px 0 0;
            font-size: 9px;
            opacity: 0.7;
        }

        .status-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: bold;
            color: #0f0;
            font-family: monospace;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 255, 100, 0.5);
            box-shadow: 0 0 12px rgba(0, 255, 100, 0.2);
            pointer-events: none;
            white-space: nowrap;
        }

        .fps-counter {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
            color: #0f0;
            pointer-events: none;
        }

        .instruction {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
            font-family: monospace;
            letter-spacing: 0.8px;
            border: 1px solid rgba(188, 19, 254, 0.5);
            background: rgba(0, 0, 0, 0.7);
        }

        .gesture-hint {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: bold;
            color: #bc13fe;
            font-family: monospace;
            pointer-events: none;
            border: 1px solid #bc13fe44;
        }

        @media (max-width: 768px) {
            .info-panel { padding: 8px 12px; bottom: 12px; left: 12px; }
            .info-panel h1 { font-size: 13px; }
            .status-badge { font-size: 9px; top: 10px; right: 10px; padding: 5px 10px; }
            .instruction { font-size: 9px; padding: 5px 14px; bottom: 12px; white-space: nowrap; }
            .gesture-hint { font-size: 8px; top: 10px; left: 10px; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* loading fallback */
        .loading-toast {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            padding: 16px 24px;
            border-radius: 48px;
            color: white;
            z-index: 200;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            font-family: monospace;
            border: 1px solid #bc13fe;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h1>🌀 HAND STORM | AI VISION</h1>
        <p>gesture controlled particle field</p>
    </div>
    <div class="status-badge" id="status">📷 starting camera...</div>
    <div class="fps-counter" id="fps">FPS: --</div>
    <div class="instruction">✋ SHOW HAND | OPEN PALM → ATTRACT | FIST → EXPLODE</div>
    <div class="gesture-hint" id="gestureLabel">⚡ GESTURE: --</div>

    <!-- Load Three.js and dependencies as modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // ---------- setup scene (optimized for mobile) ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        scene.fog = new THREE.FogExp2(0x020210, 0.0006);
        
        // camera with better mobile FOV
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 11);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limit for performance
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);
        
        // bloom effect (glow)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.4, 0.8);
        bloomPass.threshold = 0.08;
        bloomPass.strength = 1.0;
        bloomPass.radius = 0.4;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // starfield background (static but adds depth)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 600;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 180;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 70 - 30;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.1, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // ---------- PARTICLE STORM (optimized count for mobile ~8000) ----------
        const PARTICLE_COUNT = 8000;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = [];
        
        // create spherical distribution with random colors (neon purple/pink/cyan)
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const radius = Math.pow(Math.random(), 1.3) * 5.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);
            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;
            velocities.push({
                x: (Math.random() - 0.5) * 0.018,
                y: (Math.random() - 0.5) * 0.018,
                z: (Math.random() - 0.5) * 0.018
            });
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        // vertex colors (vibrant)
        const colorsArray = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const type = Math.random();
            if (type < 0.55) {
                colorsArray[i*3] = 0.7 + Math.random()*0.3;   // R
                colorsArray[i*3+1] = 0.2 + Math.random()*0.4; // G
                colorsArray[i*3+2] = 0.9 + Math.random()*0.1; // B -> purple/magenta
            } else if (type < 0.8) {
                colorsArray[i*3] = 0.2 + Math.random()*0.3;
                colorsArray[i*3+1] = 0.5 + Math.random()*0.5;
                colorsArray[i*3+2] = 1.0;
            } else {
                colorsArray[i*3] = 1.0;
                colorsArray[i*3+1] = 0.4 + Math.random()*0.5;
                colorsArray[i*3+2] = 0.8 + Math.random()*0.2;
            }
        }
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        
        const particleMaterial = new THREE.PointsMaterial({ size: 0.11, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);
        
        // central aura glow
        const auraGeometry = new THREE.SphereGeometry(1.0, 24, 24);
        const auraMaterial = new THREE.MeshBasicMaterial({ color: 0xbc13fe, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending });
        const auraSphere = new THREE.Mesh(auraGeometry, auraMaterial);
        scene.add(auraSphere);
        
        // subtle grid (low opacity)
        const gridHelper = new THREE.GridHelper(18, 16, 0x8866ff, 0x335588);
        gridHelper.position.y = -3.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.12;
        scene.add(gridHelper);
        
        // ---------- HAND TRACKING (MediaPipe, optimized for mobile) ----------
        const videoElement = document.createElement('video');
        videoElement.setAttribute('playsinline', '');
        videoElement.style.display = 'none';
        document.body.appendChild(videoElement);
        
        let handLandmarks = null;
        let handDetected = false;
        let handGesture = "open";
        let palmCenter = { x: 0.5, y: 0.5, z: 0 };
        
        function detectGesture(landmarks) {
            if (!landmarks) return "open";
            const tips = [4, 8, 12, 16, 20];
            const bases = [3, 6, 10, 14, 18];
            let total = 0;
            for (let i = 0; i < tips.length; i++) {
                const tip = landmarks[tips[i]];
                const base = landmarks[bases[i]];
                const dist = Math.hypot(tip.x - base.x, tip.y - base.y, tip.z - base.z);
                total += dist;
            }
            return total > 0.75 ? "open" : "fist";
        }
        
        // Load MediaPipe and start webcam
        async function initMediaPipeMobile() {
            try {
                const { FilesetResolver, HandLandmarker } = await import('https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3');
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = "✅ TRACKING ACTIVE";
                statusDiv.style.color = "#aaffaa";
                
                let lastTimestamp = 0;
                async function detectLoop() {
                    if (videoElement.readyState >= 2) {
                        const now = performance.now();
                        const detections = handLandmarker.detectForVideo(videoElement, now);
                        if (detections.landmarks && detections.landmarks.length > 0) {
                            handLandmarks = detections.landmarks[0];
                            handDetected = true;
                            const palm = handLandmarks[0];
                            palmCenter = { x: palm.x, y: palm.y, z: palm.z || 0 };
                            handGesture = detectGesture(handLandmarks);
                            // update gesture label
                            const gestureEl = document.getElementById('gestureLabel');
                            if (handGesture === "open") {
                                gestureEl.innerHTML = "🖐️ PALM → ATTRACT";
                                gestureEl.style.color = "#88ffaa";
                            } else {
                                gestureEl.innerHTML = "✊ FIST → EXPLODE";
                                gestureEl.style.color = "#ff8866";
                            }
                        } else {
                            handDetected = false;
                            document.getElementById('gestureLabel').innerHTML = "⚡ NO HAND";
                        }
                    }
                    requestAnimationFrame(detectLoop);
                }
                detectLoop();
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = "⚠️ CAMERA PERMISSION ERROR";
                document.getElementById('status').style.color = "#ff7777";
                document.getElementById('gestureLabel').innerHTML = "❌ CAMERA FAILED";
            }
        }
        
        initMediaPipeMobile();
        
        // Helper: convert normalized coords to world space (x: -5.5..5.5, y: -4..4, z depth)
        function handToWorld(x, y, z) {
            const worldX = (x - 0.5) * 11;
            const worldY = (0.5 - y) * 8.5;
            const worldZ = (z * 4) - 1.5;
            return new THREE.Vector3(worldX, worldY, worldZ);
        }
        
        let handWorldPos = new THREE.Vector3(0, 0, 1.5);
        let explosionKick = 0;
        
        // physics update
        function updateParticles() {
            const posAttr = particleGeometry.attributes.position.array;
            
            if (handDetected && handLandmarks) {
                const targetHand = handToWorld(palmCenter.x, palmCenter.y, palmCenter.z);
                handWorldPos.lerp(targetHand, 0.35);
                
                let strength = 0.65;
                let radius = 2.4;
                let isFist = (handGesture === "fist");
                
                if (isFist) {
                    strength = -0.85;
                    radius = 2.2;
                    explosionKick = Math.min(1.0, explosionKick + 0.12);
                } else {
                    strength = 0.98;
                    radius = 2.7;
                    explosionKick = Math.max(0, explosionKick - 0.05);
                }
                
                const finalExplode = explosionKick * 0.35;
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i * 3;
                    const iy = i * 3 + 1;
                    const iz = i * 3 + 2;
                    const px = posAttr[ix];
                    const py = posAttr[iy];
                    const pz = posAttr[iz];
                    
                    const dx = handWorldPos.x - px;
                    const dy = handWorldPos.y - py;
                    const dz = handWorldPos.z - pz;
                    const dist = Math.hypot(dx, dy, dz);
                    if (dist < radius + 1.2) {
                        let forceMag = strength * (1 - Math.min(1, dist / radius));
                        if (finalExplode > 0 && handGesture === "fist") {
                            forceMag += finalExplode * 0.6;
                        }
                        if (dist > 0.05) {
                            velocities[i].x += (dx / dist) * forceMag * 0.024;
                            velocities[i].y += (dy / dist) * forceMag * 0.024;
                            velocities[i].z += (dz / dist) * forceMag * 0.024;
                        }
                    }
                    
                    // damping + micro turbulence
                    velocities[i].x *= 0.991;
                    velocities[i].y *= 0.991;
                    velocities[i].z *= 0.991;
                    velocities[i].x += (Math.random() - 0.5) * 0.0018;
                    velocities[i].y += (Math.random() - 0.5) * 0.0018;
                    velocities[i].z += (Math.random() - 0.5) * 0.0018;
                    
                    let newX = px + velocities[i].x;
                    let newY = py + velocities[i].y;
                    let newZ = pz + velocities[i].z;
                    
                    const bound = 6.5;
                    const rad = Math.hypot(newX, newY, newZ);
                    if (rad > bound) {
                        const factor = bound / rad;
                        newX *= factor;
                        newY *= factor;
                        newZ *= factor;
                        const inwardX = -newX / rad;
                        const inwardY = -newY / rad;
                        const inwardZ = -newZ / rad;
                        const dot = velocities[i].x * inwardX + velocities[i].y * inwardY + velocities[i].z * inwardZ;
                        if (dot < 0) {
                            velocities[i].x -= 1.6 * dot * inwardX;
                            velocities[i].y -= 1.6 * dot * inwardY;
                            velocities[i].z -= 1.6 * dot * inwardZ;
                        }
                    }
                    
                    posAttr[ix] = newX;
                    posAttr[iy] = newY;
                    posAttr[iz] = newZ;
                }
            } else {
                // gentle drift when no hand
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    velocities[i].x *= 0.996;
                    velocities[i].y *= 0.996;
                    velocities[i].z *= 0.996;
                    velocities[i].x += (Math.random() - 0.5) * 0.0012;
                    velocities[i].y += (Math.random() - 0.5) * 0.0012;
                    velocities[i].z += (Math.random() - 0.5) * 0.0012;
                    
                    const ix = i * 3;
                    let px = posAttr[ix];
                    let py = posAttr[ix+1];
                    let pz = posAttr[ix+2];
                    px += velocities[i].x;
                    py += velocities[i].y;
                    pz += velocities[i].z;
                    const bound = 6.3;
                    const rad = Math.hypot(px, py, pz);
                    if (rad > bound) {
                        const f = bound / rad;
                        px *= f;
                        py *= f;
                        pz *= f;
                    }
                    posAttr[ix] = px;
                    posAttr[ix+1] = py;
                    posAttr[ix+2] = pz;
                }
            }
            particleGeometry.attributes.position.needsUpdate = true;
        }
        
        // ---------- 2D Overlay for Hand Skeleton (Mobile compatible) ----------
        const overlayCanvas = document.createElement('canvas');
        overlayCanvas.style.position = 'fixed';
        overlayCanvas.style.top = '0';
        overlayCanvas.style.left = '0';
        overlayCanvas.style.width = '100%';
        overlayCanvas.style.height = '100%';
        overlayCanvas.style.pointerEvents = 'none';
        overlayCanvas.style.zIndex = '45';
        document.body.appendChild(overlayCanvas);
        const ctx = overlayCanvas.getContext('2d');
        
        function resizeCanvas() {
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],
            [5,9],[9,13],[13,17]
        ];
        
        function drawSkeleton() {
            if (!handDetected || !handLandmarks) {
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                return;
            }
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            const w = overlayCanvas.width;
            const h = overlayCanvas.height;
            
            ctx.lineWidth = Math.max(2, Math.min(4, w / 200));
            ctx.strokeStyle = "#bc13fe";
            ctx.shadowBlur = 0;
            for (let conn of connections) {
                const p1 = handLandmarks[conn[0]];
                const p2 = handLandmarks[conn[1]];
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x * w, p1.y * h);
                    ctx.lineTo(p2.x * w, p2.y * h);
                    ctx.stroke();
                }
            }
            for (let i = 0; i < handLandmarks.length; i++) {
                const lm = handLandmarks[i];
                const x = lm.x * w;
                const y = lm.y * h;
                ctx.beginPath();
                ctx.arc(x, y, Math.max(3, w / 130), 0, Math.PI * 2);
                ctx.fillStyle = "#ff44dd";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, Math.max(1.5, w / 250), 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
            }
        }
        
        // FPS counter
        let frame = 0;
        let lastFpsTime = performance.now();
        function updateFPS() {
            frame++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round((frame * 1000) / (now - lastFpsTime));
                document.getElementById('fps').innerHTML = `FPS: ${fps}`;
                frame = 0;
                lastFpsTime = now;
            }
        }
        
        // animation loop and star rotation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            updateParticles();
            drawSkeleton();
            updateFPS();
            
            time += 0.008;
            stars.rotation.y = time * 0.08;
            stars.rotation.x = Math.sin(time * 0.2) * 0.1;
            
            // animate aura
            if (handDetected && handLandmarks) {
                const handPos3d = handToWorld(palmCenter.x, palmCenter.y, palmCenter.z);
                auraSphere.position.lerp(handPos3d, 0.25);
                const scaleTarget = handGesture === "open" ? 1.4 : 0.85;
                auraSphere.scale.lerp(new THREE.Vector3(scaleTarget, scaleTarget, scaleTarget), 0.2);
                const pulse = 0.1 + Math.sin(time * 10) * 0.05;
                auraMaterial.opacity = pulse * (handGesture === "open" ? 0.28 : 0.12);
            } else {
                auraSphere.position.lerp(new THREE.Vector3(0, 0, 0), 0.04);
                auraSphere.scale.set(0.9, 0.9, 0.9);
                auraMaterial.opacity = 0.07;
            }
            
            // gentle camera sway
            camera.position.x += (0 - camera.position.x) * 0.02;
            camera.position.y += (Math.sin(time * 0.25) * 0.15 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);
            
            effectComposer.render();
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeCanvas();
        });
        
        // handle orientation change lock for stability
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                effectComposer.setSize(window.innerWidth, window.innerHeight);
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, 50);
        });
        
        console.log("🔥 HAND STORM ACTIVE | Mobile Optimized");
    </script>
</body>
</html>

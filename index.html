<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Motion Visualizer | Face & Hand Controlled Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: #000;
            touch-action: none;
        }

        /* Floating UI */
        .ui-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 12px 18px;
            border-left: 3px solid #ff3366;
            pointer-events: none;
            font-size: 12px;
            color: white;
        }

        .ui-panel h1 {
            font-size: 16px;
            background: linear-gradient(135deg, #ff3366, #ff66cc, #33ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .shape-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 14px;
            color: #ff66cc;
            font-family: monospace;
            z-index: 100;
            border: 1px solid #ff66cc66;
            pointer-events: none;
        }

        .status-card {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-family: monospace;
            color: #0f0;
            z-index: 100;
            border: 1px solid #00ffaa66;
            pointer-events: none;
        }

        .instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 11px;
            color: white;
            white-space: nowrap;
            z-index: 100;
            font-family: monospace;
            pointer-events: none;
            text-align: center;
        }

        @media (max-width: 700px) {
            .ui-panel { padding: 8px 12px; bottom: 12px; left: 12px; }
            .shape-badge { font-size: 11px; top: 12px; left: 12px; padding: 6px 14px; }
            .status-card { font-size: 9px; top: 12px; right: 12px; }
            .instruction { font-size: 9px; bottom: 12px; white-space: nowrap; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .video-feed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            border-radius: 16px;
            border: 2px solid #ff3366;
            z-index: 200;
            opacity: 0.85;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255,51,102,0.5);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .video-feed { width: 80px; height: 60px; bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <h1>🌀 MOTION SHAPES</h1>
        <div>move your head or hand → particles change shape</div>
    </div>
    <div class="shape-badge" id="shapeLabel">⚪ CURRENT: CIRCLE</div>
    <div class="status-card" id="status">📷 loading camera...</div>
    <div class="instruction" id="instructionText">🧘 MOVE SLOWLY | SHAPE CHANGES: CIRCLE ▢ TRIANGLE ∞ WAVE</div>

    <!-- Video element for face tracking -->
    <video id="webcamVideo" class="video-feed" autoplay playsinline muted></video>

    <!-- Import Three.js and ML libraries -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- setup scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.0005);
        
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // bloom for neon look
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.7);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.0;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // background stars
        const starGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 200;
            starPos[i*3+1] = (Math.random() - 0.5) * 120;
            starPos[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.1, transparent: true, opacity: 0.4 }));
        scene.add(stars);
        
        // --- PARTICLE SYSTEM (10k particles for rich effect) ---
        const PARTICLE_COUNT = 10000;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        // store base target positions for shape morphing
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        
        // random starting positions inside sphere
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = Math.pow(Math.random(), 1.2) * 5.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;
            currentPositions[i*3] = x;
            currentPositions[i*3+1] = y;
            currentPositions[i*3+2] = z;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        // vibrant colors
        const colorsArr = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            colorsArr[i*3] = 0.7 + Math.random() * 0.3;
            colorsArr[i*3+1] = 0.3 + Math.random() * 0.5;
            colorsArr[i*3+2] = 0.8 + Math.random() * 0.2;
        }
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));
        
        const particleMat = new THREE.PointsMaterial({ size: 0.09, vertexColors: true, blending: THREE.AdditiveBlending });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);
        
        // Helper: generate shape positions (circle, square, triangle, wave/spiral)
        function generateShape(shapeType, timeOffset = 0) {
            const newTarget = new Float32Array(PARTICLE_COUNT * 3);
            const radiusBase = 4.2;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = i / PARTICLE_COUNT; // 0..1
                let x, y, z;
                const angle = t * Math.PI * 2;
                
                switch(shapeType) {
                    case 'circle':
                        // circular ring with thickness
                        const r = radiusBase;
                        x = Math.cos(angle) * r;
                        y = Math.sin(angle) * r;
                        z = (Math.sin(angle * 3) * 0.6) + (Math.cos(angle * 2) * 0.4);
                        break;
                    case 'square':
                        // square / rectangle shape
                        const side = 3.8;
                        const edge = Math.floor(t * 4);
                        const p = (t * 4) - edge;
                        if (edge === 0) { x = -side + p * 2*side; y = -side; z = Math.sin(p * Math.PI) * 0.8; }
                        else if (edge === 1) { x = side; y = -side + p * 2*side; z = Math.cos(p * Math.PI) * 0.8; }
                        else if (edge === 2) { x = side - p * 2*side; y = side; z = Math.sin(p * Math.PI) * 0.8; }
                        else { x = -side; y = side - p * 2*side; z = Math.cos(p * Math.PI) * 0.8; }
                        break;
                    case 'triangle':
                        // triangular orbit
                        const ang = angle;
                        const rTri = 4.0;
                        const corners = 3;
                        const cornerIdx = Math.floor((ang / (Math.PI*2)) * corners);
                        const cornerAng = (cornerIdx * Math.PI*2 / corners);
                        const nextAng = ((cornerIdx+1) % corners) * Math.PI*2 / corners;
                        const frac = (ang - cornerAng) / (Math.PI*2 / corners);
                        const ax = Math.cos(cornerAng) * rTri;
                        const ay = Math.sin(cornerAng) * rTri;
                        const bx = Math.cos(nextAng) * rTri;
                        const by = Math.sin(nextAng) * rTri;
                        x = ax * (1-frac) + bx * frac;
                        y = ay * (1-frac) + by * frac;
                        z = Math.sin(ang * 4) * 0.7;
                        break;
                    case 'wave':
                        // spiral wave
                        const spiralT = t;
                        const rad = 2.5 + spiralT * 3.0;
                        const angSpiral = spiralT * Math.PI * 6;
                        x = Math.cos(angSpiral) * rad;
                        y = Math.sin(angSpiral) * rad;
                        z = Math.sin(angSpiral * 2) * 1.2;
                        break;
                    default:
                        x = Math.cos(angle) * 4;
                        y = Math.sin(angle) * 4;
                        z = 0;
                }
                newTarget[i*3] = x;
                newTarget[i*3+1] = y;
                newTarget[i*3+2] = z;
            }
            return newTarget;
        }
        
        // Initialize target shapes
        let currentShape = 'circle';
        let targetShapeBuffer = generateShape('circle');
        let morphFactor = 0.02; // smoothness
        
        // --- Face & Motion Tracking using FaceMesh + simple motion delta ---
        const videoEl = document.getElementById('webcamVideo');
        let faceDetected = false;
        let facePosition = { x: 0.5, y: 0.5 }; // normalized
        let prevFaceX = 0.5, prevFaceY = 0.5;
        let motionMagnitude = 0;
        let shapeCycle = 0;
        
        // Load MediaPipe FaceMesh (lightweight for motion)
        async function initFaceTracking() {
            try {
                const { FilesetResolver, FaceLandmarker } = await import('https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.3');
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numFaces: 1
                });
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } });
                videoEl.srcObject = stream;
                await videoEl.play();
                document.getElementById('status').innerHTML = "🎥 FACE + MOTION ACTIVE";
                
                let lastTime = 0;
                async function detectFace() {
                    if (videoEl.readyState >= 2) {
                        const detections = faceLandmarker.detectForVideo(videoEl, performance.now());
                        if (detections.faceLandmarks && detections.faceLandmarks.length > 0) {
                            faceDetected = true;
                            const landmarks = detections.faceLandmarks[0];
                            // get nose tip or center of face (landmark 1)
                            const nose = landmarks[1];
                            facePosition.x = nose.x;
                            facePosition.y = nose.y;
                            
                            // calculate motion delta
                            const dx = facePosition.x - prevFaceX;
                            const dy = facePosition.y - prevFaceY;
                            motionMagnitude = Math.sqrt(dx*dx + dy*dy) * 5; // scale factor
                            
                            // update shape based on motion and position
                            // motion magnitude + horizontal position cycles shape
                            if (motionMagnitude > 0.08) {
                                // quick shape change based on direction
                                const angle = Math.atan2(dy, dx);
                                if (angle > -Math.PI/4 && angle < Math.PI/4) shapeCycle = (shapeCycle + 0.03) % 4;
                                else if (Math.abs(dy) > 0.05) shapeCycle = (shapeCycle + 0.02) % 4;
                                else shapeCycle = (shapeCycle + 0.01) % 4;
                            } else {
                                shapeCycle = (shapeCycle + 0.002) % 4;
                            }
                            
                            // map shapeCycle to shape (0:circle,1:square,2:triangle,3:wave)
                            let newShape = 'circle';
                            if (shapeCycle < 0.25) newShape = 'circle';
                            else if (shapeCycle < 0.5) newShape = 'square';
                            else if (shapeCycle < 0.75) newShape = 'triangle';
                            else newShape = 'wave';
                            
                            if (newShape !== currentShape) {
                                currentShape = newShape;
                                targetShapeBuffer = generateShape(currentShape);
                                // update UI
                                const shapeNames = { circle: '⚪ CIRCLE', square: '⬛ SQUARE', triangle: '🔺 TRIANGLE', wave: '🌊 WAVE' };
                                document.getElementById('shapeLabel').innerHTML = `✨ ${shapeNames[currentShape]}`;
                                // haptic-like flash in text
                                document.getElementById('instructionText').style.opacity = '0.7';
                                setTimeout(() => document.getElementById('instructionText').style.opacity = '1', 150);
                            }
                            
                            prevFaceX = facePosition.x;
                            prevFaceY = facePosition.y;
                        } else {
                            faceDetected = false;
                        }
                    }
                    requestAnimationFrame(detectFace);
                }
                detectFace();
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = "⚠️ CAMERA ERROR";
                // fallback: random shape cycle anyway
                setInterval(() => {
                    const shapes = ['circle', 'square', 'triangle', 'wave'];
                    const rand = shapes[Math.floor(Math.random() * 4)];
                    if (rand !== currentShape) {
                        currentShape = rand;
                        targetShapeBuffer = generateShape(currentShape);
                        document.getElementById('shapeLabel').innerHTML = `🌀 ${rand.toUpperCase()}`;
                    }
                }, 3000);
            }
        }
        
        initFaceTracking();
        
        // --- Particle morphing update: smoothly interpolate to target shape ---
        function updateParticleMorph() {
            const posAttr = particleGeo.attributes.position.array;
            let changed = false;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                const tx = targetShapeBuffer[ix];
                const ty = targetShapeBuffer[iy];
                const tz = targetShapeBuffer[iz];
                
                let cx = posAttr[ix];
                let cy = posAttr[iy];
                let cz = posAttr[iz];
                
                // move towards target
                let speed = 0.045;
                if (motionMagnitude > 0.1) speed = 0.09; // faster morph on motion
                
                cx += (tx - cx) * speed;
                cy += (ty - cy) * speed;
                cz += (tz - cz) * speed;
                
                posAttr[ix] = cx;
                posAttr[iy] = cy;
                posAttr[iz] = cz;
            }
            particleGeo.attributes.position.needsUpdate = true;
        }
        
        // additional swirling effect based on face horizontal movement
        let swirlAngle = 0;
        function addMotionSwirl() {
            if (!faceDetected) return;
            const posAttr = particleGeo.attributes.position.array;
            const strength = Math.min(0.12, motionMagnitude * 0.8);
            if (strength < 0.01) return;
            const centerX = (facePosition.x - 0.5) * 3;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i*3, iz = i*3+2;
                let px = posAttr[ix];
                let pz = posAttr[iz];
                const angle = Math.atan2(pz, px);
                const rad = Math.hypot(px, pz);
                const newAngle = angle + strength * 0.2;
                posAttr[ix] = Math.cos(newAngle) * rad;
                posAttr[iz] = Math.sin(newAngle) * rad;
            }
            particleGeo.attributes.position.needsUpdate = true;
        }
        
        // --- FPS and animation ---
        let frameCount = 0;
        let lastFPSTime = performance.now();
        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastFPSTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFPSTime));
                document.getElementById('status').innerHTML = `🎥 FACE OK | ${fps} FPS`;
                frameCount = 0;
                lastFPSTime = now;
            }
        }
        
        // camera subtle sway
        let time = 0;
        function animateCamera() {
            time += 0.008;
            const targetX = (facePosition.x - 0.5) * 0.8;
            const targetY = (facePosition.y - 0.5) * -0.6;
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);
            stars.rotation.y = time * 0.05;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            updateParticleMorph();
            addMotionSwirl();
            animateCamera();
            updateFPS();
            
            effectComposer.render();
        }
        
        animate();
        
        // handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // generate initial shapes for all
        setTimeout(() => {
            targetShapeBuffer = generateShape('circle');
            console.log('ready: Motion shape visualizer active');
        }, 100);
        
        // add a small hint for interactive particles
        const overlayMsg = document.createElement('div');
        overlayMsg.style.position = 'fixed';
        overlayMsg.style.bottom = '70px';
        overlayMsg.style.left = '50%';
        overlayMsg.style.transform = 'translateX(-50%)';
        overlayMsg.style.background = '#ff336622';
        overlayMsg.style.backdropFilter = 'blur(8px)';
        overlayMsg.style.padding = '6px 14px';
        overlayMsg.style.borderRadius = '40px';
        overlayMsg.style.fontSize = '10px';
        overlayMsg.style.color = '#ff99cc';
        overlayMsg.style.zIndex = '99';
        overlayMsg.style.fontFamily = 'monospace';
        overlayMsg.innerText = '👆 move your HEAD or HAND → particles change shape dynamically';
        document.body.appendChild(overlayMsg);
        setTimeout(() => overlayMsg.remove(), 5000);
    </script>
</body>
</html>
